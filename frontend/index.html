<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karan Goel - Software Engineer, Cloud Infrastructure & Agentic AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arcade: {
                            bg: '#0a0014',
                            panel: '#150726',
                            border: '#ff2bd6',
                            border2: '#00fff9',
                            link: '#00fff9',
                            linkHover: '#ff2bd6',
                            text: '#d8f8ff',
                            accent: '#39ff14',
                            header: '#000000',
                            headerText: '#39ff14',
                            muted: '#9d8ec7',
                            tag: '#1a0033',
                            tagBorder: '#00fff9',
                            yellow: '#ffe600'
                        },
                        resume: {
                            primary: '#111827',
                            secondary: '#4b5563',
                            accent: '#2b7a78' // The teal/blue color from the original resume
                        }
                    },
                    fontFamily: {
                        'arcade': ['"VT323"', '"Courier New"', 'monospace'],
                        'pixel': ['"Press Start 2P"', 'monospace'],
                        'mono': ['"Courier New"', 'Courier', 'monospace'],
                        'resume': ['Arial', 'Helvetica', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* CRT scanline + vignette overlay for the arcade cabinet feel */
        @media screen {
            a { text-decoration: none; }
            a:hover { text-decoration: underline; }

            body {
                position: relative;
            }

            body::before {
                content: '';
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 40;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.035) 0px,
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px,
                    transparent 3px
                );
            }

            body::after {
                content: '';
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 41;
                box-shadow: inset 0 0 12vw rgba(0, 0, 0, 0.75);
            }

            .neon-text {
                text-shadow: 0 0 4px currentColor, 0 0 12px currentColor, 0 0 24px currentColor;
            }

            .neon-box {
                box-shadow: 0 0 6px currentColor, 0 0 16px currentColor;
            }

            .arcade-pattern {
                background-image:
                    linear-gradient(rgba(0, 255, 249, 0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 255, 249, 0.08) 1px, transparent 1px);
                background-size: 28px 28px;
            }
        }

        /* Print styles for saving as PDF - always the clean professional layout */
        @media print {
            @page {
                margin: 0.5in;
                size: letter;
            }
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            /* Ensure page breaks don't cut items in half */
            .print-break-inside-avoid {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-arcade-bg text-arcade-text font-arcade text-[18px] leading-relaxed p-2 sm:p-4 md:p-4 md:p-8 print:p-0 print:bg-white print:text-[14px] print:font-resume arcade-pattern">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
